          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('functions/api/state.js')
          s=p.read_text()
          s2=re.sub(r'^const DEFAULT_STATE = \{.*?\n\};\n\nasync function ensureTable', "import { DEFAULT_STATE } from './default-state.js';\n\nasync function ensureTable", s, count=1, flags=re.S)
