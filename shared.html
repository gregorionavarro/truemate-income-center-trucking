<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrueMate Income Center · Trucking & Commercial</title>
<style>
html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;background:#f4f7fb}.wrap{height:100%;display:flex;flex-direction:column}.syncbar{height:42px;flex:0 0 42px;background:#102f51;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:700;box-sizing:border-box}.left{display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:#f0b429;box-shadow:0 0 0 3px rgba(255,255,255,.08)}.ok .dot{background:#2fc179}.bad .dot{background:#ef5d6c}.muted{opacity:.8;font-weight:500}iframe{border:0;width:100%;flex:1;background:#f4f7fb}
</style>
</head>
<body>
<div class="wrap">
  <div class="syncbar" id="syncbar">
    <div class="left"><span class="dot"></span><span id="status">Conectando base compartida…</span></div>
    <span class="muted">TrueMate · Multiusuario</span>
  </div>
  <iframe id="app" title="TrueMate Income Center"></iframe>
</div>
<script>
const KEYS=['tmic_r','tmic_p','tmic_c','tmic_t','tmic_a','tmic_l','tmic_w','tmic_h','tmic_n'];
const defaults={
  tmic_r:'[]',
  tmic_p:'["Greg","Carlos","Paulina","Fabiola"]',
  tmic_c:'["Imperial PFS","Great West","RPS"]',
  tmic_t:'[]',tmic_a:'[]',tmic_h:'[]',tmic_n:'[]',
  tmic_l:'{"RPS":"https://rpsins.epaypolicy.com/","Guardian":"https://guardian-ins.epaypolicy.com/","Rocklake":"https://rocklakeig.epaypolicy.com/","Burns and Wilcox":"https://burnsandwilcox.epaypolicy.com/"}',
  tmic_w:'{"users":[{"name":"Gregorio Navarro","email":"gregorio.navarro@truemategroup.com","active":true},{"name":"Paulina Restrepo","email":"paulina@truemategroup.com","active":true},{"name":"Camila Penagos","email":"camila@truemategroup.com","active":true},{"name":"Fabiola Bermudez","email":"fabiola.bermudez@truemategroup.com","active":true}],"assignments":{"carrierReview":"paulina@truemategroup.com","carrierPayment":"gregorio.navarro@truemategroup.com","deferredCollection":"camila@truemategroup.com"},"internalNotifications":true}'
};
const bar=document.getElementById('syncbar'),statusEl=document.getElementById('status'),frame=document.getElementById('app');
let lastServer='',saving=false,booted=false;
function setStatus(text,type=''){statusEl.textContent=text;bar.className='syncbar '+type}
function read(key){try{return JSON.parse(localStorage.getItem(key)||defaults[key])}catch(_){return JSON.parse(defaults[key])}}
function localState(){return {r:read('tmic_r'),p:read('tmic_p'),c:read('tmic_c'),t:read('tmic_t'),a:read('tmic_a'),l:read('tmic_l'),w:read('tmic_w'),h:read('tmic_h'),n:read('tmic_n')}}
function coreState(s){return {r:Array.isArray(s?.r)?s.r:[],p:Array.isArray(s?.p)?s.p:JSON.parse(defaults.tmic_p),c:Array.isArray(s?.c)?s.c:JSON.parse(defaults.tmic_c),t:Array.isArray(s?.t)?s.t:[],a:Array.isArray(s?.a)?s.a:[],l:s?.l&&typeof s.l==='object'&&!Array.isArray(s.l)?s.l:JSON.parse(defaults.tmic_l),w:s?.w&&typeof s.w==='object'&&!Array.isArray(s.w)?s.w:JSON.parse(defaults.tmic_w),h:Array.isArray(s?.h)?s.h:[],n:Array.isArray(s?.n)?s.n:[]}}
function stateString(s){return JSON.stringify(coreState(s))}
function applyState(s){const x=coreState(s);localStorage.setItem('tmic_r',JSON.stringify(x.r));localStorage.setItem('tmic_p',JSON.stringify(x.p));localStorage.setItem('tmic_c',JSON.stringify(x.c));localStorage.setItem('tmic_t',JSON.stringify(x.t));localStorage.setItem('tmic_a',JSON.stringify(x.a));localStorage.setItem('tmic_l',JSON.stringify(x.l));localStorage.setItem('tmic_w',JSON.stringify(x.w));localStorage.setItem('tmic_h',JSON.stringify(x.h));localStorage.setItem('tmic_n',JSON.stringify(x.n))}
function modalOpen(){try{return frame.contentDocument?.getElementById('modal')?.classList.contains('on')||!!frame.contentDocument?.querySelector('.tm-overlay')||!!frame.contentDocument?.querySelector('.tm-del-confirm')}catch(_){return false}}
async function getRemote(){const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error('No se pudo leer D1');return r.json()}
async function saveRemote(s){if(saving)return;saving=true;try{setStatus('Guardando cambios…');const r=await fetch('/api/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({state:s})});if(!r.ok)throw new Error('No se pudo guardar');lastServer=stateString(s);setStatus('Sincronizado · todos ven la misma información','ok')}catch(e){setStatus('Error de sincronización · revisa conexión','bad')}finally{saving=false}}
function displayName(email){const known={'gregorio.navarro@truemategroup.com':'Gregorio Navarro','fabiola.bermudez@truemategroup.com':'Fabiola Bermudez','paulina@truemategroup.com':'Paulina Restrepo','camila@truemategroup.com':'Camila Penagos'};if(known[email])return known[email];const local=(email||'Usuario').split('@')[0].replace(/[._-]+/g,' ');return local.replace(/\b\w/g,c=>c.toUpperCase())}
async function markPresence(){try{const r=await fetch('/api/whoami',{cache:'no-store'});if(!r.ok)return;const id=await r.json();const email=String(id.email||'').toLowerCase();if(!email)return;const s=localState();const now=new Date().toISOString();const i=(s.a||[]).findIndex(x=>String(x.email||'').toLowerCase()===email);const item={email,name:displayName(email),lastAccess:now};if(i>=0)s.a[i]={...s.a[i],...item};else s.a.push(item);localStorage.setItem('tmic_a',JSON.stringify(s.a));await saveRemote(s)}catch(e){console.warn('No se pudo registrar último acceso',e)}}
async function injectTools(){
  try{
    const d=frame.contentDocument;if(!d)return;
    const tools=[['tm-delete-tools','/delete-tools.js?v=5'],['tm-operational-tools','/operational-tools.js?v=1'],['tm-business-rules-v2','/business-rules-v2.js?v=1'],['tm-invoice-guard','/invoice-guard.js?v=1'],['tm-executive-rankings','/executive-rankings.js?v=2'],['tm-monthly-executive','/monthly-executive.js?v=3'],['tm-filters-v2','/filters-v2.js?v=3'],['tm-income-review','/income-review.js?v=1'],['tm-camila-carrier-flow','/camila-carrier-flow.js?v=3'],['tm-settings-recovery','/settings-recovery.js?v=2'],['tm-dashboard-extras','/dashboard-extras.js?v=2'],['tm-deferred-income-fix','/deferred-income-fix.js?v=3'],['tm-tasks-stable','/tasks-stable.js?v=2'],['tm-deferred-payment-fix','/deferred-payment-fix.js?v=3'],['tm-deferred-breakdown','/deferred-breakdown.js?v=1'],['tm-carrier-overdue-fix','/carrier-overdue-fix.js?v=1'],['tm-final-ops-fixes','/final-ops-fixes.js?v=2'],['tm-carrier-review-workflow','/carrier-review-workflow.js?v=2'],['tm-carrier-review-flex','/carrier-review-flex.js?v=2'],['tm-carrier-payment-edit-ui','/carrier-payment-edit-ui.js?v=1'],['tm-carrier-payment-portals','/carrier-payment-portals.js?v=4'],['tm-income-client-note','/income-client-note.js?v=2'],['tm-owner-link','/owner-link.js?v=4'],['tm-app-notices','/app-notices.js?v=1'],['tm-carrier-delete-tools','/carrier-delete-tools.js?v=2'],['tm-month-context','/month-context.js?v=6'],['tm-summary-workflow-stable','/summary-workflow-stable.js?v=1'],['tm-monthly-report','/monthly-report.js?v=1'],['tm-sync-bridge','/sync-bridge.js?v=2']];
    for(const [id,src] of tools){if(d.getElementById(id))continue;await new Promise(resolve=>{const s=d.createElement('script');s.id=id;s.src=src;s.onload=resolve;s.onerror=resolve;d.head.appendChild(s)});}
  }catch(e){console.error(e)}
}
function compactDashboard(){try{const d=frame.contentDocument;if(!d)return;d.title='TrueMate Income Center · Trucking & Commercial';const brand=d.querySelector('.top h1');if(brand)brand.textContent='TrueMate Income Center · Trucking & Commercial';let st=d.getElementById('tm-compact-dashboard');if(!st){st=d.createElement('style');st.id='tm-compact-dashboard';st.textContent=`
.grid2{display:block!important;margin-top:18px!important}.grid2>.card{width:100%!important}.grid2>.card+.card{margin-top:12px!important}
#summary>.panel{padding-top:16px!important}
#summary>.panel>.head{align-items:center!important;margin-bottom:12px!important}
#summary>.panel>.head>div:last-child{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:8px!important;flex-wrap:wrap!important}
#summary>.panel>.head>div:last-child br{display:none!important}
#summary #tmMonthlyReportBtn{width:auto!important;margin-top:0!important;white-space:nowrap!important;padding:10px 13px!important}
#summary .hero{margin-top:0!important}
#summary .cash{background:linear-gradient(135deg,#174675,#3c7fbe)!important;min-height:0!important;padding:22px!important;box-shadow:none!important}
#summary .cash::before,#summary .cash::after{display:none!important}
#summary .cash>*{max-width:none!important}
@media(max-width:950px){#summary>.panel>.head{align-items:flex-start!important}#summary>.panel>.head>div:last-child{justify-content:flex-start!important}}
`;d.head.appendChild(st)}}catch(e){console.error(e)}}
frame.addEventListener('load',()=>{injectTools();compactDashboard()});
async function boot(){try{const data=await getRemote();const normalized=coreState(data.state);applyState(normalized);lastServer=stateString(normalized);setStatus('Sincronizado · todos ven la misma información','ok');await markPresence()}catch(e){KEYS.forEach(k=>{if(localStorage.getItem(k)==null)localStorage.setItem(k,defaults[k])});setStatus('Modo local temporal · D1 no respondió','bad')}frame.src='/app.html?v=40';booted=true}
function notifyFrameStateChanged(){try{frame.contentWindow.dispatchEvent(new Event('tm-state-updated'))}catch(_){}}
setInterval(async()=>{if(!booted)return;const local=localState(),localStr=stateString(local);if(localStr!==lastServer){await saveRemote(local);return}try{const data=await getRemote();const remoteState=coreState(data.state);const remoteStr=stateString(remoteState);if(remoteStr!==lastServer&&!modalOpen()){applyState(remoteState);lastServer=remoteStr;notifyFrameStateChanged();setStatus('Actualizado con cambios del equipo','ok')}}catch(e){setStatus('Sin conexión con D1','bad')}},2500);
boot();
</script>
</body>
</html>
